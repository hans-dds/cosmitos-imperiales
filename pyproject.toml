[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "gssp"
version = "0.1.0"

dependencies = [
    "streamlit==1.50.0",
    "openpyxl==3.1.5",
    "scikit-learn==1.7.1",
    "plotly==6.3.1",
    "kaleido==0.2.1",
    "mysql-connector-python==8.0.33",
    "pytest==7.4.0",
    "pytest-cov==4.1.0",
    "pdfkit",
    "xlsxwriter",
    "nltk==3.9.2",
    "wordcloud==1.9.4",
    "fpdf2==2.7.9"
]

[tool.setuptools.packages.find]
where = ["src/main"] # busca los paquetes en 'src/main'.

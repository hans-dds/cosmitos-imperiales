name: Python Flake8 Lint

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install dev dependencies
        run: |
          pip install -e .[dev]
      - name: Run flake8
        run: |
          flake8 src/

sonar.projectKey=cosmitos1
sonar.projectName=Cosmitos1
sonar.projectVersion=1.0

# --- FUENTES Y TESTS ---
# Decimos que la fuente es "todo" el directorio actual...
sonar.sources=.
# ...pero definimos explícitamente dónde están los tests
sonar.tests=tests

# --- EXCLUSIONES (CRUCIAL) ---
# 1. Excluimos la carpeta de tests de ser considerada "código fuente" (para no duplicar)
# 2. Excluimos las carpetas de DATOS (csv, xlsx, eml) para que Sonar las ignore totalmente.
# 3. Excluimos los notebooks (.ipynb) si no son código de producción.
sonar.exclusions=.venv/**, \
                 .git/**, \
                 tests/**, \
                 datos_analizados/**, \
                 excel_data/**, \
                 sent_emails/**, \
                 reports/**, \
                 model/**, \
                 **/__pycache__/**, \
                 **/*.egg-info/**, \
                 uv.lock

# --- CONFIGURACIÓN PYTHON ---
# Patrón para identificar tus archivos de test
sonar.python.tests.reportPath=tests/
sonar.python.version=3.11

# Archivo de cobertura (lo generaremos con uv en el siguiente paso)
sonar.python.coverage.reportPaths=coverage.xml